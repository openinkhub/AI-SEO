  // Upload rule: images go to Cloudflare R2 only. Until R2 is configured on
  // the server, uploads are refused (never written to the wiped local disk).
  function storageNoticeHtml() {
    if (lib.storage === 'unconfigured') {
      return '<div class="warn">Image uploads are blocked until Cloudflare R2 is configured on the server ' +
        '(R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_PUBLIC_URL). Existing images are unaffected.</div>';
    }
    if (lib.storage === 'local') {
      return '<div class="warn">Development mode: images are stored on the local disk, not in R2.</div>';
    }
    if (lib.storage === 'r2') {
      return '<div class="muted" style="font-size:12px;margin:6px 0;">Images are stored in Cloudflare R2.</div>';
    }
    return '';
  }

  // WP parity: "Originally Fetched: N page(s) · Current Total: M page(s) (+x since original fetch)".
  function pageCountHtml() {
    var cur = lib.pages.length;
    var h = '<p class="muted" style="margin:4px 0 8px;font-size:13px;"><strong>Originally fetched:</strong> ' +
      (lib.original == null ? '—' : lib.original) + ' page(s) &nbsp;·&nbsp; <strong>Current total:</strong> ' + cur + ' page(s)';
    if (lib.original != null && cur !== lib.original) {
      var d = cur - lib.original;
      h += ' <span style="color:var(--accent,#2563eb);">(' + (d > 0 ? '+' : '') + d + ' since original fetch)</span>';
    }
    return h + '</p>';
  }

  function libFetchPages(btn) {
    var cid = state.cid;
    btn.disabled = true;
    setLibMsg('Fetching live pages and H1 keywords… this can take up to a minute.', false);
    api(libBase() + '/pages/fetch', { method: 'POST', body: {} }).then(function(pages){
      if (cid !== state.cid) return;
      lib.pages = Array.isArray(pages) ? pages : lib.pages;
      lib.msg = { text: 'Done — ' + lib.pages.length + ' pages in the library.', err: false };
      // the first fetch (or one on an empty library) sets the baseline server-side
      api(libBase() + '/pages/summary').then(function(sm){ if (cid === state.cid && sm) { lib.original = sm.original; drawLibrary(); } }).catch(function(){});
      drawLibrary();
    }).catch(function(err){ btn.disabled = false; setLibMsg('Could not fetch pages: ' + err.message, true); });
  }

  function libAddPage(btn) {
    var cid = state.cid;
    var url = document.getElementById('newPageUrl').value.trim();
    var name = document.getElementById('newPageName').value.trim();
    if (!url) { setLibMsg('Enter a page URL first.', true); return; }
    btn.disabled = true;
    var body = { pageUrl: url };
    if (name) body.pageName = name;
    var alias = document.getElementById('newPageAlias').value.trim();
    if (alias) body.aliasName = alias;
    api(libBase() + '/pages', { method: 'POST', body: body }).then(function(page){
      if (cid !== state.cid) return;
      lib.pages.push(page);
      lib.msg = { text: 'Page added.', err: false };
      drawLibrary();
    }).catch(function(err){ btn.disabled = false; setLibMsg('Could not add page: ' + err.message, true); });
  }

  function libUploadImage(btn) {
    var cid = state.cid;
    var input = document.getElementById('newImageFile');
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) { setLibMsg('Choose one or more image files first.', true); return; }
    var alt = files.length === 1 ? document.getElementById('newImageAlt').value.trim() : '';
    var room = MAX_IMAGES - lib.images.length;
    var skipped = [];
    var queue = files.filter(function(f){
      if (IMAGE_TYPES.indexOf(f.type) === -1) { skipped.push(f.name + ' (not JPEG/PNG/WebP/GIF)'); return false; }
      if (f.size > MAX_IMAGE_BYTES) { skipped.push(f.name + ' (over 8 MB)'); return false; }
      return true;
    });
    if (queue.length > room) {
      queue.slice(Math.max(room, 0)).forEach(function(f){ skipped.push(f.name + ' (library limit of ' + MAX_IMAGES + ')'); });
      queue = queue.slice(0, Math.max(room, 0));
    }
    if (!queue.length) { setLibMsg('Nothing to upload: ' + skipped.join('; '), true); return; }
    btn.disabled = true;
    var done = 0, failed = [], total = queue.length;
    // One request per file, one after another - keeps every request small
    // enough for Hostinger's edge and lets one bad file fail on its own.
    function next() {
      if (cid !== state.cid) return;
      if (!queue.length) {
        var parts = [done + ' image' + (done === 1 ? '' : 's') + ' uploaded'];
        var bad = skipped.concat(failed);
        if (bad.length) parts.push('not uploaded: ' + bad.join('; '));
        lib.msg = { text: parts.join('. ') + '.', err: done === 0 && bad.length > 0 };
        drawLibrary();
        return;
      }
      var file = queue.shift();
      setLibMsg('Uploading ' + (total - queue.length) + ' of ' + total + ': ' + file.name + '…', false);
      var fd = new FormData();
      fd.append('file', file);
      if (alt) fd.append('altText', alt);
      api(libBase() + '/images', { method: 'POST', body: fd }).then(function(img){
        if (cid === state.cid) lib.images.unshift(img);
        done++;
      }).catch(function(err){
        failed.push(file.name + ' (' + err.message + ')');
      }).then(next);
    }
    next();
  }

  function libDeleteImage(id) {
    var cid = state.cid;
    if (!window.confirm('Delete this image? Any page mapped to it will be un-mapped (pages are kept).')) return;
    api(libBase() + '/images/' + id, { method: 'DELETE' }).then(function(){
      if (cid !== state.cid) return;
      lib.images = lib.images.filter(function(i){ return i.id !== id; });
      lib.pages.forEach(function(p){ if (p.libraryImageId === id) p.libraryImageId = null; });
      lib.msg = { text: 'Image deleted.', err: false };
      drawLibrary();
    }).catch(function(err){ setLibMsg('Could not delete image: ' + err.message, true); });
  }

  function libDeletePage(id) {
    var cid = state.cid;
    if (!window.confirm('Remove this page from the library? The image itself is kept.')) return;
    api(libBase() + '/pages/' + id, { method: 'DELETE' }).then(function(){
      if (cid !== state.cid) return;
      lib.pages = lib.pages.filter(function(p){ return p.id !== id; });
      lib.msg = { text: 'Page removed.', err: false };
      drawLibrary();
    }).catch(function(err){ setLibMsg('Could not remove page: ' + err.message, true); });
  }

  function libExtractH1(btn) {
    var cid = state.cid;
    btn.disabled = true;
    setLibMsg('Extracting H1 keywords…', false);
    api(libBase() + '/pages/extract-h1', { method: 'POST', body: {} }).then(function(pages){
      if (cid !== state.cid) return;
      lib.pages = Array.isArray(pages) ? pages : lib.pages;
      var missing = lib.pages.filter(function(p){ return !p.h1Keyword; }).length;
      lib.msg = { text: missing ? 'Done — ' + missing + ' page(s) still have no H1 (none found, or time ran out; click again to retry).' : 'Done — every page has an H1 keyword.', err: false };
      drawLibrary();
    }).catch(function(err){ btn.disabled = false; setLibMsg('Could not extract H1: ' + err.message, true); });
  }

  // Fetches meta title + description for the pages that have none yet, then pushes the page data into the SEO report(s).
  function libFetchMeta(btn) {
    var cid = state.cid;
    btn.disabled = true;
    setLibMsg('Fetching meta titles and descriptions…', false);
    api(libBase() + '/pages/extract-meta', { method: 'POST', body: {} }).then(function(pages){
      if (cid !== state.cid) return;
      lib.pages = Array.isArray(pages) ? pages : lib.pages;
      var left = lib.pages.filter(function(p){ return p.metaTitle == null; }).length;
      return api('/customers/' + cid + '/audits/refresh-pages', { method: 'POST', body: {} }).then(function(r){
        if (cid !== state.cid) return;
        lib.msg = { text: (left ? left + ' page(s) not reached yet (click again). ' : 'Every page has its meta data. ') + 'SEO report updated (' + ((r && r.updated) || 0) + ' report' + (((r && r.updated) || 0) === 1 ? '' : 's') + ').', err: false };
        drawLibrary();
      });
    }).catch(function(err){ btn.disabled = false; setLibMsg('Could not fetch meta data: ' + err.message, true); });
  }

  // Inline edit of alias / H1: saved on change, no redraw (keeps keyboard focus).
  function libEditPage(pageId, body, okMsg) {
    var cid = state.cid;
    api(libBase() + '/pages/' + pageId, { method: 'PATCH', body: body }).then(function(page){
      if (cid !== state.cid) return;
      lib.pages = lib.pages.map(function(p){ return p.id === pageId ? page : p; });
      setLibMsg(okMsg, false);
    }).catch(function(err){ setLibMsg('Could not save: ' + err.message, true); });
  }

  function libMapPage(pageId, imageId) {
    var cid = state.cid;
    setLibMsg('Saving…', false);
    api(libBase() + '/pages/' + pageId, { method: 'PATCH', body: { libraryImageId: imageId } }).then(function(page){
      if (cid !== state.cid) return;
      lib.pages = lib.pages.map(function(p){ return p.id === pageId ? page : p; });
      lib.msg = { text: imageId ? 'Image mapped.' : 'Image un-mapped.', err: false };
      drawLibrary();
    }).catch(function(err){ setLibMsg('Could not save mapping: ' + err.message, true); drawLibrary(); });
  }

  // Added 2026-10-06: cleans up throwaway signups. Server cascades the

  function renderRuns() {
    var box = document.getElementById('runsList');
    if (!box) return;
    if (!state.runs.length) { box.innerHTML = '<p class="muted">No audits run yet for this customer.</p>'; return; }
    box.innerHTML = state.runs.map(function(r){ return runRowHtml(r); }).join('');
    state.runs.forEach(function(r){
      var reportBtn = document.getElementById('report-' + r.id);
      if (reportBtn) reportBtn.addEventListener('click', function(){ viewReport(r.id); });
      var tasksBtn = document.getElementById('tasks-' + r.id);
      if (tasksBtn) tasksBtn.addEventListener('click', function(){ togglePanel(r.id, 'tasks'); });
      var pushesBtn = document.getElementById('pushes-' + r.id);
      if (pushesBtn) pushesBtn.addEventListener('click', function(){ togglePanel(r.id, 'pushes'); });
      var evBtn = document.getElementById('evidence-' + r.id);
      if (evBtn) evBtn.addEventListener('click', function(){ togglePanel(r.id, 'evidence'); });
      var pkgBtn = document.getElementById('package-' + r.id);
      if (pkgBtn) pkgBtn.addEventListener('click', function(){ togglePanel(r.id, 'package'); });
      var resBtn = document.getElementById('research-' + r.id);
      if (resBtn) resBtn.addEventListener('click', function(){
        resBtn.disabled = true;
        api('/customers/' + state.cid + '/audits/' + r.id + '/enrich', { method: 'POST' }).then(function(){ loadRuns(); }).catch(function(err){ resBtn.disabled = false; alert('Could not start research: ' + err.message); });
      });
      var resBlkBtn = document.getElementById('research-blocked-' + r.id);
      if (resBlkBtn) resBlkBtn.addEventListener('click', function(){
        resBlkBtn.disabled = true;
        api('/customers/' + state.cid + '/audits/' + r.id + '/enrich?mode=blocked', { method: 'POST' }).then(function(){ loadRuns(); }).catch(function(err){ resBlkBtn.disabled = false; alert('Could not start research: ' + err.message); });
      });
      var refreshBtn = document.getElementById('refresh-' + r.id);
      if (refreshBtn) refreshBtn.addEventListener('click', function(){ loadRuns(); });
    });
    state.runs.forEach(function(r){
      if (state.expanded[r.id] === 'tasks') loadTasks(r.id);
      if (state.expanded[r.id] === 'pushes') loadPushes(r.id);
      if (state.expanded[r.id] === 'evidence') loadEvidence(r.id);
      if (state.expanded[r.id] === 'package') loadPackage(r.id);
    });
  }

  function runRowHtml(r) {
    var panel = state.expanded[r.id];
    var html = '<div class="run-row"><div class="top">';
    var pg = r.progress;
    html += '<div>' + statusBadge(r.status) +
      (pg
        ? ' <strong>' + pg.done + ' done</strong> of ' + pg.total + ' skills' +
          ' <span class="muted">· ' + pg.waiting + ' waiting for research · ' + pg.blocked + ' blocked (no data) · ' + pg.notBuilt + ' not built yet · ' + pg.notApplicable + ' not applicable</span>'
        : ' <strong>' + (r.completedSkills != null ? r.completedSkills : 0) + '/' + (r.totalSkills != null ? r.totalSkills : 140) + '</strong> skills') +
      ' <span class="muted">started ' + fmtDate(r.startedAt || r.createdAt) + '</span>' +
      (r.enrichStatus ? ' <span class="muted">· research: ' + (r.enrichStatus === 'running' ? 'collecting…' : r.enrichStatus) + (r.enrichNote ? ' (' + escapeHtml(String(r.enrichNote).slice(0, 160)) + ')' : '') + '</span>' : '') + '</div>';
    html += '<div class="row-actions">';
    html += '<button id="refresh-' + r.id + '">Refresh</button>';
    html += '<button id="report-' + r.id + '"' + (r.status !== 'completed' ? ' disabled' : '') + '>View report</button>';
    html += '<button id="tasks-' + r.id + '">' + (panel === 'tasks' ? 'Hide tasks' : 'View tasks') + '</button>';
    html += '<button id="pushes-' + r.id + '">' + (panel === 'pushes' ? 'Hide pushes' : 'View pushes') + '</button>';
    html += '<button id="evidence-' + r.id + '">' + (panel === 'evidence' ? 'Hide evidence' : 'Evidence') + '</button>';
    html += '<button id="research-' + r.id + '"' + (r.status !== 'completed' || r.enrichStatus === 'running' ? ' disabled' : '') + '>Run research</button>';
    html += '<button id="research-blocked-' + r.id + '" title="Collect only the sources that still have blocked or waiting tasks"' + (r.status !== 'completed' || r.enrichStatus === 'running' ? ' disabled' : '') + '>Run blocked only</button>';
    html += '<button id="package-' + r.id + '">' + (panel === 'package' ? 'Hide package' : 'Package') + '</button>';
    html += '</div></div><div id="panel-' + r.id + '"></div></div>';
    return html;
  }

  function togglePanel(runId, kind) {
    state.expanded[runId] = state.expanded[runId] === kind ? null : kind;
    renderRuns();
  }

  function loadTasks(runId) {
    var panel = document.getElementById('panel-' + runId);
    if (panel) panel.innerHTML = '<p class="muted">Loading tasks…</p>';
    api('/customers/' + state.cid + '/audits/' + runId + '/tasks').then(function(data){
      var tasks = Array.isArray(data) ? data : (data.items || []);
      var STATE = { done: 'Done', waiting: 'Waiting for research', blocked: 'Blocked (no data)', not_built: 'Not built yet', not_applicable: 'Not applicable' };
      var order = { blocked: 0, waiting: 1, not_built: 2, done: 3, not_applicable: 4 };
      var counts = {};
      tasks.forEach(function(t){ counts[t.state] = (counts[t.state] || 0) + 1; });
      tasks.sort(function(a, b){ return (order[a.state] - order[b.state]) || String(a.group).localeCompare(String(b.group)); });
      var rows = tasks.map(function(t, i){
        return '<tr><td>' + (i + 1) + '</td><td>' + escapeHtml(t.group) + '</td><td>' + escapeHtml(t.plugin + ':' + t.skill) + '</td>' +
          '<td><strong>' + escapeHtml(STATE[t.state] || t.state) + '</strong></td>' +
          '<td>' + escapeHtml(t.api || '') + (t.apiWired === false && t.state !== 'not_applicable' ? ' <em>(not wired)</em>' : '') + '</td>' +
          '<td>' + escapeHtml(t.apiKey || '') + '</td>' +
          '<td>' + escapeHtml(t.layerNumbers ? t.layerNumbers.join(', ') : '') + '</td>' +
          '<td>' + escapeHtml((t.finding || '').slice(0, 160)) + '</td>' +
          '<td>' + (t.metrics && t.metrics.length ? t.metrics.map(function(m){ return escapeHtml(m); }).join('<br>') : '') + '</td></tr>';
      }).join('');
      var summary = Object.keys(STATE).map(function(k){ return (counts[k] || 0) + ' ' + STATE[k].toLowerCase(); }).join(' · ');
      var p = document.getElementById('panel-' + runId);
      if (p) p.innerHTML = '<p class="muted"><strong>' + tasks.length + ' tasks</strong> — ' + summary + '. Blocked and waiting tasks are listed first.</p>' +
        '<div class="task-scroll"><table><thead><tr>' +
        '<th>#</th><th>Group</th><th>Skill</th><th>State</th><th>API / tool</th><th>Key needed</th><th>Layers</th><th>Finding / reason</th><th>Source comparison (DA, PA, DR, traffic, backlinks…)</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    }).catch(function(err){
      var p = document.getElementById('panel-' + runId);
      if (p) p.innerHTML = '<p class="muted">Failed to load tasks: ' + escapeHtml(err.message) + '</p>';
    });
  }

  function loadPushes(runId) {
    var panel = document.getElementById('panel-' + runId);
    if (panel) panel.innerHTML = '<p class="muted">Loading layer pushes…</p>';
    api('/customers/' + state.cid + '/audits/' + runId + '/pushes').then(function(data){
      var pushes = Array.isArray(data) ? data : (data.items || []);
      var p = document.getElementById('panel-' + runId);
      if (!p) return;
      if (!pushes.length) { p.innerHTML = '<p class="muted">No layer pushes for this run.</p>'; return; }
      var rows = pushes.map(function(x){
        return '<tr><td>Layer ' + escapeHtml(x.layerNumber) + '</td><td>' + statusBadge(x.status) + '</td>' +
          '<td>' + escapeHtml((x.suggestion || '').slice(0, 140)) + '</td><td>' + fmtDate(x.pushedAt) + '</td></tr>';
      }).join('');
      p.innerHTML = '<div class="task-scroll"><table><thead><tr>' +
        '<th>Layer</th><th>Status</th><th>Suggestion</th><th>Pushed at</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    }).catch(function(err){
      var p = document.getElementById('panel-' + runId);
      if (p) p.innerHTML = '<p class="muted">Failed to load pushes: ' + escapeHtml(err.message) + '</p>';
    });
  }

  function apiMsg(prov, text) {
    var m = document.querySelector('[data-msg="' + prov + '"]');
    if (m) m.textContent = text;
  }

  function apiReplace(item) {
    apiState.items = apiState.items.map(function(x){ return x.provider === item.provider ? item : x; });
  }

  function apiAction(cust, prov, act, el) {
    var base = '/customers/' + cust.id + '/api-settings/' + prov;
    var det = document.querySelector('details[data-p="' + prov + '"]');
    var done = function(item){ if (item) apiReplace(item); drawCustomerApis(cust); };
    if (act === 'save') {
      var values = {};
      Array.prototype.forEach.call(det.querySelectorAll('input[data-f]'), function(i){ values[i.getAttribute('data-f')] = i.value; });
      el.disabled = true; apiMsg(prov, 'Saving…');
      api(base, { method: 'PUT', body: { values: values } }).then(done)
        .catch(function(err){ el.disabled = false; apiMsg(prov, 'Could not save: ' + err.message); });
    } else if (act === 'test') {
      el.disabled = true; apiMsg(prov, 'Testing…');
      api(base + '/test', { method: 'POST', body: {} }).then(done)
        .catch(function(err){ el.disabled = false; apiMsg(prov, 'Test failed: ' + err.message); });
    } else if (act === 'enabled') {
      api(base, { method: 'PUT', body: { enabled: el.checked } }).then(done)
        .catch(function(err){ apiMsg(prov, 'Could not update: ' + err.message); });
    } else if (act === 'remove') {
      if (!window.confirm('Remove the saved ' + prov + ' settings for this customer?')) return;
      api(base, { method: 'DELETE' }).then(function(){ return api('/customers/' + cust.id + '/api-settings'); })
        .then(function(items){ apiState.items = items; drawCustomerApis(cust); })
        .catch(function(err){ apiMsg(prov, 'Could not remove: ' + err.message); });
    }
  }

  function loadEvidence(runId) {
    var panel = document.getElementById('panel-' + runId);
    if (!panel) return;
    if (panel.getAttribute('data-ev')) { refreshEvidence(runId); return; }
    panel.setAttribute('data-ev', '1');
    panel.innerHTML = '<div class="ev-wrap"><p class="muted" id="evNote-' + runId + '">Loading…</p>' +
      '<div class="row-actions" style="margin:8px 0"><button class="primary" id="evComplete-' + runId + '">Complete</button>' +
      '<span class="muted" id="evProgress-' + runId + '">Upload files in the sections below. Nothing is read or added to the reports until you press Complete.</span></div>' +
      '<div id="evSections-' + runId + '"></div></div>';
    document.getElementById('evComplete-' + runId).addEventListener('click', function(){ completeEvidence(runId); });
    api(evBase(runId) + '/evidence-status').then(function(st){
      state.evSections = (st && st.sections) || [];
      evNote(runId, (st && st.readerConfigured ? 'Reader: ready.' : 'Reader: NOT configured (set ANTHROPIC_API_KEY on the server) — screenshots/PDFs cannot be read yet.') +
        ' Storage: ' + escapeHtml(st && st.storage ? st.storage : 'unknown') + '.');
      refreshEvidence(runId);
    }).catch(function(err){ evNote(runId, 'Could not load sections: ' + escapeHtml(err.message)); });
  }

  function evNote(runId, msg) {
    var n = document.getElementById('evNote-' + runId);
    if (n) n.innerHTML = msg;
  }

  function evProgress(runId, msg) {
    var n = document.getElementById('evProgress-' + runId);
    if (n) n.textContent = msg;
  }

  function refreshEvidence(runId) {
    var cid = state.cid;
    return api(evBase(runId) + '/evidence').then(function(items){
      if (cid !== state.cid) return;
      var box = document.getElementById('evSections-' + runId);
      if (!box) return;
      items = Array.isArray(items) ? items : [];
      var secs = state.evSections || [];
      var open = {};
      Array.prototype.forEach.call(box.querySelectorAll('details[data-sec]'), function(d){ open[d.getAttribute('data-sec')] = d.open; });
      var html = secs.map(function(sec){
        var mine = items.filter(function(e){ return (e.section || 'other') === sec.key; });
        var queued = mine.filter(function(e){ return e.status === 'uploaded'; }).length;
        var isOpen = open[sec.key] != null ? open[sec.key] : mine.length > 0;
        return '<details data-sec="' + sec.key + '" class="run-row"' + (isOpen ? ' open' : '') + '><summary style="cursor:pointer"><strong>' + escapeHtml(sec.label) + '</strong> ' +
          '<span class="muted">' + mine.length + ' file' + (mine.length === 1 ? '' : 's') + (queued ? ' · ' + queued + ' waiting' : '') + '</span></summary>' +
          '<p class="muted" style="margin:6px 0">' + escapeHtml(sec.hint) + '</p>' +
          (sec.accepts ? '<div class="row-actions" style="margin:6px 0"><input type="file" multiple id="evFiles-' + runId + '-' + sec.key + '" accept="' + escapeHtml(sec.accepts) + '">' +
          '<button id="evUp-' + runId + '-' + sec.key + '">Upload</button></div>' : '') +
          mine.map(function(e){ return evidenceRowHtml(runId, e); }).join('') + '</details>';
      }).join('');
      box.innerHTML = html;
      secs.forEach(function(sec){
        var b = document.getElementById('evUp-' + runId + '-' + sec.key);
        if (b) b.addEventListener('click', function(){ uploadEvidence(runId, sec.key); });
      });
      items.forEach(function(e){ wireEvidenceRow(runId, e); });
    }).catch(function(err){
      var box = document.getElementById('evSections-' + runId);
      if (box) box.innerHTML = '<p class="muted">Failed to load evidence: ' + escapeHtml(err.message) + '</p>';
    });
  }

  function completeEvidence(runId) {
    var btn = document.getElementById('evComplete-' + runId);
    btn.disabled = true;
    var total = 0, failed = 0, first = true;
    function step() {
      var body = first ? { retry: true } : {};
      first = false;
      return api(evBase(runId) + '/evidence/process-next', { method: 'POST', body: body }).then(function(r){
        total += r.processed; failed += r.failed;
        evProgress(runId, 'Reading files… ' + total + ' done' + (r.remaining ? ', ' + r.remaining + ' to go' : ''));
        return refreshEvidence(runId).then(function(){ return r.remaining > 0 && r.processed > 0 ? step() : r; });
      });
    }
    evProgress(runId, 'Reading files…');
    step().then(function(){
      evProgress(runId, 'Building reports…');
      return api(evBase(runId) + '/rebuild-report', { method: 'POST', body: {} });
    }).then(function(){
      evProgress(runId, 'Complete — ' + total + ' file' + (total === 1 ? '' : 's') + ' read' + (failed ? ', ' + failed + ' failed (see below)' : '') + '. Screenshots/PDFs still need your Approve before customers see them.');
      return refreshEvidence(runId);
    }).catch(function(err){
      evProgress(runId, 'Stopped: ' + err.message);
    }).finally(function(){ btn.disabled = false; });
  }

  function evidenceRowHtml(runId, e) {
    var h = '<div class="run-row" style="display:flex;gap:12px;align-items:flex-start">';
    if (e.kind === 'image' && e.url && /\.pdf$/i.test(e.fileName)) h += '<a href="' + escapeHtml(e.url) + '" target="_blank" rel="noopener" class="badge pending">PDF</a>';
    else if (e.kind === 'image' && e.url) h += '<a href="' + escapeHtml(e.url) + '" target="_blank" rel="noopener"><img src="' + escapeHtml(e.url) + '" alt="" style="width:90px;height:64px;object-fit:cover;border:1px solid var(--border-soft);border-radius:6px"></a>';
    h += '<div style="flex:1;min-width:0"><div>' + evStatusBadge(e.status) + ' <strong>' + escapeHtml(EV_LABELS[e.evidenceType] || e.evidenceType) + '</strong> ' +
      '<span class="muted">' + escapeHtml(e.fileName) + '</span></div>';
    if (e.error) h += '<div class="muted" style="color:#b42318;margin-top:4px">' + escapeHtml(e.error) + '</div>';
    h += '<div class="row-actions" style="margin-top:8px">';
    if (e.extracted) h += '<button id="evEdit-' + e.id + '">View / edit data</button>';
    if (e.extracted && e.status === 'extracted') h += '<button class="primary" id="evApprove-' + e.id + '">Approve</button>';
    if (e.extracted && e.status === 'approved') h += '<button id="evUnapprove-' + e.id + '">Unapprove</button>';
    if (e.kind === 'image') h += '<button id="evRe-' + e.id + '">Re-read</button>';
    h += '<label class="muted"><input type="checkbox" id="evInc-' + e.id + '"' + (e.includeInReport ? ' checked' : '') + '> in report</label>';
    h += '<button id="evDel-' + e.id + '">Delete</button></div>';
    h += '<div id="evData-' + e.id + '"></div></div></div>';
    return h;
  }

  function evPatch(runId, id, body) {
    return api(evBase(runId) + '/evidence/' + id, { method: 'PATCH', body: body })
      .then(function(){ return refreshEvidence(runId); })
      .catch(function(err){ alert('Could not update: ' + err.message); });
  }

  function wireEvidenceRow(runId, e) {
    var on = function(id, fn){ var el = document.getElementById(id + e.id); if (el) el.addEventListener('click', fn); };
    on('evApprove-', function(){ evPatch(runId, e.id, { status: 'approved' }); });
    on('evUnapprove-', function(){ evPatch(runId, e.id, { status: 'extracted' }); });
    var inc = document.getElementById('evInc-' + e.id);
    if (inc) inc.addEventListener('change', function(){ evPatch(runId, e.id, { includeInReport: inc.checked }); });
    on('evRe-', function(){
      this.disabled = true; this.textContent = 'Reading…';
      api(evBase(runId) + '/evidence/' + e.id + '/extract', { method: 'POST', body: {} })
        .then(function(){ return refreshEvidence(runId); })
        .catch(function(err){ alert('Could not read: ' + err.message); refreshEvidence(runId); });
    });
    on('evDel-', function(){
      if (!window.confirm('Delete "' + e.fileName + '" from this audit?')) return;
      api(evBase(runId) + '/evidence/' + e.id, { method: 'DELETE' })
        .then(function(){ return refreshEvidence(runId); })
        .catch(function(err){ alert('Could not delete: ' + err.message); });
    });
    on('evEdit-', function(){
      var box = document.getElementById('evData-' + e.id);
      if (box.innerHTML) { box.innerHTML = ''; return; }
      box.innerHTML = '<p class="muted">Loading…</p>';
      api(evBase(runId) + '/evidence/' + e.id + '/data').then(function(d){
        box.innerHTML = '<textarea id="evJson-' + e.id + '" style="width:100%;min-height:200px;font:12px/1.4 monospace;margin-top:8px"></textarea>' +
          '<div class="row-actions" style="margin-top:6px"><button class="primary" id="evSave-' + e.id + '">Save changes</button><span class="muted" id="evMsg-' + e.id + '"></span></div>';
        var ta = document.getElementById('evJson-' + e.id);
        ta.value = JSON.stringify(d.extracted, null, 2);
        document.getElementById('evSave-' + e.id).addEventListener('click', function(){
          try { JSON.parse(ta.value); } catch (x) { document.getElementById('evMsg-' + e.id).textContent = 'Not valid JSON: ' + x.message; return; }
          evPatch(runId, e.id, { extractedJson: ta.value });
        });
      }).catch(function(err){ box.innerHTML = '<p class="muted">Failed: ' + escapeHtml(err.message) + '</p>'; });
    });
  }

  function uploadEvidence(runId, section) {
    var input = document.getElementById('evFiles-' + runId + '-' + section);
    var btn = document.getElementById('evUp-' + runId + '-' + section);
    var files = input && input.files ? Array.prototype.slice.call(input.files) : [];
    if (!files.length) { alert('Choose one or more files first.'); return; }
    btn.disabled = true;
    var errors = [], i = 0;
    function next() {
      if (i >= files.length) {
        if (errors.length) alert(errors.join('\n'));
        evProgress(runId, files.length - errors.length + ' file(s) saved. Press Complete when all uploads are done.');
        return refreshEvidence(runId);
      }
      btn.textContent = 'Uploading ' + (i + 1) + '/' + files.length + '…';
      var fd = new FormData();
      fd.append('section', section);
      fd.append('file', files[i]);
      var name = files[i].name;
      i++;
      return api(evBase(runId) + '/evidence', { method: 'POST', body: fd })
        .catch(function(err){ errors.push(name + ': ' + err.message); })
        .then(next);
    }
    next();
  }

  // ---- Customer package: Strategy + sign-off + Compile ----------------

  function pkgBase(runId) { return evBase(runId) + '/package'; }

  function loadPackage(runId) {
    var panel = document.getElementById('panel-' + runId);
    if (!panel) return;
    panel.innerHTML = '<p class="muted">Loading package…</p>';
    api(pkgBase(runId)).then(function(st){ renderPackage(runId, st); })
      .catch(function(err){
        var p = document.getElementById('panel-' + runId);
        if (p) p.innerHTML = '<p class="muted">Failed to load package: ' + escapeHtml(err.message) + '</p>';
      });
  }

  function pkgAct(runId, path, method, body, busyMsg) {
    var note = document.getElementById('pkgMsg-' + runId);
    if (note) note.textContent = busyMsg || 'Working…';
    return api(pkgBase(runId) + path, { method: method || 'POST', body: body || {} })
      .then(function(st){ renderPackage(runId, st); })
      .catch(function(err){
        var n = document.getElementById('pkgMsg-' + runId);
        if (n) n.innerHTML = '<span style="color:var(--fail)">' + escapeHtml(err.message) + '</span>';
      });
  }

  function renderPackage(runId, st) {
    var panel = document.getElementById('panel-' + runId);
    if (!panel) return;
    var gates = (st.gates || []).map(function(g){
      var items = (g.items || []).map(function(i){
        return '<li style="margin:2px 0">' + (i.ok ? '✓' : '✗') + ' ' + escapeHtml(i.label) + ' <span class="muted">— ' + escapeHtml(i.detail) + '</span></li>';
      }).join('');
      return '<div style="margin:6px 0"><span class="badge ' + (g.ok ? 'ok' : 'pending') + '">' + (g.ok ? 'done' : 'to do') + '</span> <strong>' + escapeHtml(g.label) + '</strong> ' +
        '<span class="muted">' + escapeHtml(g.detail) + '</span>' + (items ? '<ul style="margin:4px 0 0 28px;padding:0;list-style:none;font-size:13px">' + items + '</ul>' : '') + '</div>';
    }).join('');
    var s = st.strategy;
    var stratHtml;
    if (!s) {
      stratHtml = '<p class="muted">No strategy yet. It is drafted from the audit findings and the tool evidence; you review, edit and approve it.</p>';
    } else {
      stratHtml = '<p style="margin:6px 0">' + escapeHtml(s.executiveSummary || '') + '</p>' +
        '<ol style="margin:6px 0 6px 20px;padding:0;font-size:13px">' + (s.priorities || []).map(function(p){
          return '<li><strong>' + escapeHtml(p.title) + '</strong> <span class="muted">(' + escapeHtml(p.area) + (p.when ? ', ' + escapeHtml(p.when) : '') + ')</span></li>';
        }).join('') + '</ol>';
    }
    var statusTxt = st.strategyStatus === 'approved' ? 'approved' : (st.strategyStatus === 'draft' ? 'draft — needs your approval' : 'not written');
    var src = st.strategySource === 'ai' ? 'AI draft' : (st.strategySource === 'rules' ? 'rules-based draft' : (st.strategySource || ''));
    panel.innerHTML = '<div class="ev-wrap">' +
      '<p class="muted" style="margin:4px 0">The customer sees ONE document: SEO Report + Strategy + Deliverables + Terms &amp; Conditions. Until you compile it they see “being prepared”.</p>' +
      '<h4 style="margin:10px 0 4px">Checklist</h4>' + gates +
      '<h4 style="margin:12px 0 4px">Strategy <span class="badge ' + (st.strategyStatus === 'approved' ? 'ok' : 'pending') + '">' + escapeHtml(statusTxt) + '</span> <span class="muted">' + escapeHtml(src) + '</span></h4>' +
      (st.strategyNote ? '<p class="muted" style="margin:2px 0">' + escapeHtml(st.strategyNote) + '</p>' : '') +
      stratHtml +
      '<div class="row-actions" style="margin:8px 0">' +
        '<button id="pkgGen-' + runId + '">' + (s ? 'Re-generate draft' : 'Generate strategy draft') + '</button>' +
        (s ? '<button id="pkgEdit-' + runId + '">Edit strategy (JSON)</button>' : '') +
        (s && st.strategyStatus !== 'approved' ? '<button class="primary" id="pkgApprove-' + runId + '">Approve strategy</button>' : '') +
        (s && st.strategyStatus === 'approved' ? '<button id="pkgUnapprove-' + runId + '">Unapprove</button>' : '') +
      '</div><div id="pkgEditBox-' + runId + '"></div>' +
      '<div style="margin:10px 0"><label><input type="checkbox" id="pkgSign-' + runId + '"' + (st.signedOff ? ' checked' : '') + '> <strong>Admin sign-off</strong> — I have checked the audit, uploads and strategy</label></div>' +
      '<div class="row-actions" style="margin:8px 0">' +
        '<button class="primary" id="pkgCompile-' + runId + '"' + (st.canCompile ? '' : ' disabled') + '>' + (st.compiled ? 'Re-compile customer document' : 'Compile customer document') + '</button>' +
        '<button id="pkgPreview-' + runId + '">' + (st.compiled ? 'View customer document' : 'Preview (not compiled)') + '</button>' +
        '<span class="muted" id="pkgMsg-' + runId + '">' + (st.compiled ? 'Compiled ' + escapeHtml(fmtDate(st.compiledAt)) + ' — the customer sees this version.' : (st.canCompile ? 'Ready to compile.' : 'Finish the checklist to enable Compile.')) + '</span>' +
      '</div></div>';
    var on = function(id, fn){ var el = document.getElementById(id + '-' + runId); if (el) el.addEventListener('click', fn); };
    on('pkgGen', function(){
      if (s && !confirm('Re-generating replaces the current strategy (and un-approves it). Continue?')) return;
      pkgAct(runId, '/strategy/generate', 'POST', {}, 'Writing the strategy… this can take up to a minute.');
    });
    on('pkgApprove', function(){ pkgAct(runId, '/strategy/approve', 'POST', {}, 'Approving…'); });
    on('pkgUnapprove', function(){ pkgAct(runId, '/strategy/unapprove', 'POST', {}, 'Un-approving…'); });
    on('pkgCompile', function(){ pkgAct(runId, '/compile', 'POST', {}, 'Compiling the customer document…'); });
    on('pkgPreview', function(){
      api(pkgBase(runId) + '/preview').then(function(data){
        var html = (data && data.__html) || '<p>Empty.</p>';
        window.open(URL.createObjectURL(new Blob([html], { type: 'text/html' })), '_blank');
      }).catch(function(err){ alert('Could not load the document: ' + err.message); });
    });
    on('pkgEdit', function(){
      var box = document.getElementById('pkgEditBox-' + runId);
      if (!box) return;
      box.innerHTML = '<textarea id="pkgJson-' + runId + '" style="width:100%;min-height:260px;font:12px/1.4 monospace"></textarea>' +
        '<div class="row-actions" style="margin:6px 0"><button class="primary" id="pkgSave-' + runId + '">Save changes</button><button id="pkgCancel-' + runId + '">Cancel</button>' +
        '<span class="muted">Saving makes it a draft again — approve it afterwards.</span></div>';
      document.getElementById('pkgJson-' + runId).value = JSON.stringify(s, null, 2);
      document.getElementById('pkgCancel-' + runId).addEventListener('click', function(){ box.innerHTML = ''; });
      document.getElementById('pkgSave-' + runId).addEventListener('click', function(){
        pkgAct(runId, '/strategy', 'PUT', { strategyJson: document.getElementById('pkgJson-' + runId).value }, 'Saving…');
      });
    });
    var sign = document.getElementById('pkgSign-' + runId);
    if (sign) sign.addEventListener('change', function(){ pkgAct(runId, '/signoff', 'POST', { signedOff: sign.checked }, 'Saving sign-off…'); });
  }

  function viewReport(runId) {
    api('/customers/' + state.cid + '/audits/' + runId + '/report').then(function(data){
      var html = (data && data.__html) || '<p>Empty report.</p>';
      var url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      window.open(url, '_blank');
    }).catch(function(err){ alert('Could not load report: ' + err.message); });
  }

  renderNav();
  loadCustomers();
})();
</script>
</body>
</html>
